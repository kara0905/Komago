[package]
name = "komago"
version = "0.1.0"
description = "Lecture et gestion locale de mangas, webcomics et comics"
authors = ["Clément et les contributeurs de Komago"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kara0905/Komago"
publish = false
edition = "2021"
rust-version = "1.89"
resolver = "3"

[lib]
name = "komago_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
quick-xml = "0.42"
regex = "1"
uuid = { version = "1", features = ["v7"] }
blake3 = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
strsim = "0.11"
sevenz-rust2 = { version = "0.20", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
unrar = "0.5.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
