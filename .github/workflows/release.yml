name: Release

# Une étiquette vX.Y.Z crée une version en BROUILLON avec les paquets des trois
# systèmes : rien n'est publié tant que le brouillon n'est pas relu et validé à
# la main sur GitHub. Les paquets ne sont pas signés.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            target: ""
          - os: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: ${{ matrix.target }}
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: bun install --frozen-lockfile
      - run: bun run test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Komago ${{ github.ref_name }}
          releaseBody: Voir le [journal des versions](https://github.com/kara0905/Komago/blob/main/CHANGELOG.md).
          releaseDraft: true
          args: ${{ matrix.args }}
      # Lancement manuel, sans étiquette : les paquets restent en artefacts.
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: komago-${{ matrix.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
