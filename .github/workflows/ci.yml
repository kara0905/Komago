name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Tauri 2.11 est figé sur Rust 1.89 ; voir docs/ARCHITECTURE.md.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # rustls utilise aws-lc, qui a besoin de NASM sous Windows.
      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # L'inventaire des licences doit suivre les dépendances.
      - name: Inventaire des licences à jour
        if: runner.os == 'Linux'
        run: |
          bun run third-party
          git diff --exit-code THIRD-PARTY.md
      - name: Compilation de l'application
        run: bunx tauri build --debug --no-bundle
